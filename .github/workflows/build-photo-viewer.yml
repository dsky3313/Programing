name: Build photo_viewer.exe

# 테스트 중에는 빌드하지 않음. 최종본일 때만 수동 실행 (Actions 탭 > Run workflow)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow pyinstaller
      - name: Build exe
        working-directory: photo_viewer
        run: pyinstaller --onefile --windowed --name photo_viewer photo_viewer.py
      - uses: actions/upload-artifact@v4
        with:
          name: photo_viewer-exe
          path: photo_viewer/dist/photo_viewer.exe
