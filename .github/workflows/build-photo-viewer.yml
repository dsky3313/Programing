name: Build photo_viewer.exe

on:
  push:
    paths:
      - "photo_viewer/**"
      - ".github/workflows/build-photo-viewer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow pyinstaller
      - name: Build exe
        working-directory: photo_viewer
        run: pyinstaller --onefile --windowed --name photo_viewer photo_viewer.py
      - uses: actions/upload-artifact@v4
        with:
          name: photo_viewer-exe
          path: photo_viewer/dist/photo_viewer.exe
